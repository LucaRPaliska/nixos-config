$fileManager = thunar
$mainMod = SUPER
$term = kitty
$scriptsDir = $HOME/.config/hypr/scripts

source = ~/.config/hypr/monitors.conf

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Graphite-Dark

